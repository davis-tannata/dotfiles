set -g default-shell /opt/homebrew/bin/fish

bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"
setw -g mode-keys vi
# Ctrl+B then Shift+C → clear screen + history in all windows
bind-key C run-shell '
for win in $(tmux list-windows -F "#{window_id}"); do
  for pid in $(tmux list-panes -t $win -F "#{pane_id}"); do
    tmux send-keys -t $pid C-l
    tmux clear-history -t $pid
  done
done
tmux display-message "Cleared all windows (screen + scrollback) ✅"
'

set -g allow-rename off
set -g automatic-rename off

# show current session (project) name in the terminal/tab title
set -g set-titles on
set -g set-titles-string "#S"

# --- Claude agent dashboard -------------------------------------------------
# Always-on status strip: shows every agent's state (⏳working 🔴waiting ✅done)
set -g status-interval 2
set -g status-right-length 140
set -g status-right "#(~/.local/scripts/claude-dashboard)#[fg=default] %H:%M "
# prefix + a  → detailed agent sidebar in a narrow pane (close with prefix + x)
bind-key a split-window -h -l 34 "exec ~/.local/scripts/claude-sidebar"

# Color the window in the window list by its Claude agent state (@claude_state,
# set per-window by claude-agent-state): red=waiting, yellow=working, green=done.
setw -g window-status-format "#{?#{==:#{@claude_state},waiting},#[fg=colour196 bold],#{?#{==:#{@claude_state},working},#[fg=colour214],#{?#{==:#{@claude_state},done},#[fg=colour154],#[default]}}} #I:#W #[default]"
setw -g window-status-current-format "#[fg=default bold reverse] #I:#W #[default]"

